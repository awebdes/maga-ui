<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reel</title>
<meta name="description" content="3D device mockups and promo videos: pose devices by hand, animate with scene keys, export PNG and MP4.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect x=%224%22 y=%2212%22 width=%224%22 height=%228%22 rx=%221.5%22 fill=%22%2359bcff%22/%3E%3Crect x=%2210%22 y=%224%22 width=%224%22 height=%2216%22 rx=%221.5%22 fill=%22%238b5cff%22/%3E%3Crect x=%2216%22 y=%228%22 width=%224%22 height=%2212%22 rx=%221.5%22 fill=%22%2359bcff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@300..800&family=Manrope:wght@300..800&family=Unbounded:wght@300..800&family=Playfair+Display:wght@400..800&display=swap">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="5.5" width="3.4" height="13" rx="1" fill="currentColor" stroke="none"/><rect x="13.6" y="5.5" width="3.4" height="13" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M4.5 11a5 5 0 0 1 5-5H18l-2.5-2.5"/><path d="M19.5 13a5 5 0 0 1-5 5H6l2.5 2.5"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><path d="M12 4.5l7.5 7.5-7.5 7.5L4.5 12z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4.5 9.5 9 5"/><path d="M4.5 9.5h9a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l4.5-4.5L15 5"/><path d="M19.5 9.5h-9a6 6 0 0 0 0 12h3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 19.5h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5V4.5"/><path d="M7 9l5-5 5 5"/><path d="M5 19.5h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9.5 7V5.5h5V7"/><path d="M7 7l.8 11.2A1.9 1.9 0 0 0 9.7 20h4.6a1.9 1.9 0 0 0 1.9-1.8L17 7"/></symbol>
    <symbol id="i-dup" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 5.5V5A1.5 1.5 0 0 0 14 3.5H6A2.5 2.5 0 0 0 3.5 6v8A1.5 1.5 0 0 0 5 15.5h.5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16"/><path d="M10 6a9.6 9.6 0 0 1 2-.5C18 5.5 21.5 12 21.5 12a17 17 0 0 1-2.7 3.4M6.2 7.5A16 16 0 0 0 2.5 12S6 18.5 12 18.5a9 9 0 0 0 4-.9"/><path d="M9.9 9.9a2.8 2.8 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.6"/><path d="M10.5 5.5h3"/></symbol>
    <symbol id="i-tablet" viewBox="0 0 24 24"><rect x="4.5" y="3" width="15" height="18" rx="2.4"/><circle cx="12" cy="5.4" r=".4"/></symbol>
    <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="10" rx="1.6"/><path d="M2.5 18.5h19l-1.6-3H4.1z"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5.5 6.5V5h13v1.5"/><path d="M12 5v14"/><path d="M9 19h6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10.5" rx="2.4"/><path d="M16 11l5-3v8.5l-5-3"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4.5V8h-3.5"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3.5v17M3.5 12h17"/><path d="M9.5 6L12 3.5 14.5 6M9.5 18l2.5 2.5 2.5-2.5M6 9.5L3.5 12 6 14.5M18 9.5l2.5 2.5-2.5 2.5"/></symbol>
    <symbol id="i-safe" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 7h14M5 17h14" stroke-dasharray="2 2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 16l4.5-4.5 4 4 2.5-2.5 6 6"/><circle cx="15.5" cy="9.5" r="1.5"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.2 5.6 1.8-5.6 1.9L12 17.5l-1.9-5.1-5.6-1.9 5.6-1.8z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <div class="stage" aria-hidden="true"></div>

  <main class="frame-wrap" id="frame-wrap">
    <div class="frame" id="frame">
      <canvas id="view" tabindex="0" aria-label="Scene. Drag a device to turn it, Space or right button drag to move it. Drag empty space to orbit the camera, scroll to dolly."></canvas>
      <div class="overlay" id="overlay" aria-hidden="true"></div>
      <div class="frame-busy" id="frame-busy" hidden><div class="busy-card glass"><span class="mono" id="busy-text">Rendering…</span><div class="busy-bar"><i id="busy-bar"></i></div><button class="cell sm ghost" id="busy-cancel">Cancel</button></div></div>
    </div>
    <div class="frame-meta mono" id="frame-meta"></div>
    <div class="drop-hint" id="drop-hint"><span><svg class="i i-lg"><use href="#i-upload"/></svg>Drop on a device to put it on the screen</span></div>
  </main>

  <div class="chrome" id="chrome">
    <!-- top left: brand + project -->
    <div class="float tl">
      <div class="island glass" style="position:relative">
        <button class="cell clear brand" data-menu="brand-menu" aria-label="Project">
          <span class="reel-logo" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-name">Reel</span>
          <span class="brand-scene" id="project-name"></span>
          <span class="caret" aria-hidden="true"></span>
        </button>
        <div class="menu below" id="brand-menu" style="width:280px">
          <div class="menu-label caps">Start from</div>
          <div id="template-items"></div>
          <div class="menu-sep"></div>
          <button class="menu-item" data-action="open"><svg class="i"><use href="#i-file"/></svg><span>Open project…</span><span class="kbd">⌘O</span></button>
          <button class="menu-item" data-action="save"><svg class="i"><use href="#i-download"/></svg><span>Save project<span class="sub">JSON with your screens inside</span></span><span class="kbd">⌘S</span></button>
        </div>
      </div>
      <div class="island glass">
        <button class="cell clear icon-btn" id="undo" data-tip="Undo" data-kbd="⌘Z" aria-label="Undo"><svg class="i"><use href="#i-undo"/></svg></button>
        <button class="cell clear icon-btn" id="redo" data-tip="Redo" data-kbd="⇧⌘Z" aria-label="Redo"><svg class="i"><use href="#i-redo"/></svg></button>
      </div>
    </div>

    <!-- top centre: format and tools -->
    <div class="float tc">
      <div class="island glass" style="position:relative">
        <div class="seg" id="format-seg" aria-label="Format"></div>
        <button class="cell clear icon-btn sm" data-menu="format-menu" aria-label="More formats"><svg class="i i-sm"><use href="#i-dots"/></svg></button>
        <div class="menu below-end" id="format-menu" style="width:252px"></div>
      </div>
      <div class="island glass">
        <div class="seg icons" id="tool-seg" aria-label="Drag on a device">
          <button data-value="rotate" aria-checked="true" data-tip="Turn" data-kbd="R" aria-label="Turn"><svg class="i"><use href="#i-rotate"/></svg></button>
          <button data-value="move" data-tip="Move · or hold Space" data-kbd="G" aria-label="Move"><svg class="i"><use href="#i-move"/></svg></button>
        </div>
        <button class="cell clear icon-btn" id="safe-btn" data-toggle data-tip="Safe zones" data-kbd="S" aria-label="Safe zones"><svg class="i"><use href="#i-safe"/></svg></button>
      </div>
    </div>

    <!-- top right: export -->
    <div class="float tr">
      <div class="island glass" style="position:relative">
        <button class="cell primary export-btn" id="export-btn" data-juice data-tip="Export" data-kbd="E" aria-expanded="false" aria-controls="export-sheet"><span class="progress"></span><svg class="i"><use href="#i-download"/></svg><span>Export</span></button>
        <section class="panel sheet" id="export-sheet" role="dialog" aria-label="Export">
          <div class="panel-head">
            <div class="panel-title"><span>Export</span></div>
            <button class="cell clear icon-btn panel-close" id="export-close" aria-label="Close export"><svg class="i"><use href="#i-close"/></svg></button>
          </div>
          <div class="panel-body">
            <div class="sheet-row"><span class="sheet-label caps">File</span>
              <div class="seg" id="exp-kind" aria-label="File type"><button data-value="mp4" aria-checked="true">MP4</button><button data-value="webm">WebM</button><button data-value="png">PNG</button></div></div>
            <div class="sheet-row"><span class="sheet-label caps">Size</span>
              <div class="seg" id="exp-scale" aria-label="Size"><button data-value="0.5">½×</button><button data-value="1" aria-checked="true">1×</button><button data-value="2">2×</button></div></div>
            <div class="sheet-row" id="exp-fps-row"><span class="sheet-label caps">Frame rate</span>
              <div class="seg" id="exp-fps" aria-label="Frame rate"><button data-value="30">30</button><button data-value="60" aria-checked="true">60</button></div></div>
            <div class="sheet-row" id="exp-alpha-row" hidden><span class="sheet-label caps">Background</span>
              <div class="seg" id="exp-alpha" aria-label="Background"><button data-value="keep" aria-checked="true">As set</button><button data-value="none">Transparent</button></div></div>
            <div class="sheet-note" id="exp-note"></div>
            <div class="sheet-result" id="exp-result" hidden>
              <div class="sheet-preview checker"><img id="exp-img" alt="Exported frame"><video id="exp-video" muted loop playsinline controls></video></div>
              <div class="sheet-meta mono" id="exp-meta"></div>
            </div>
            <div class="sheet-actions">
              <button class="cell lg juice-go" id="exp-render" data-juice><span class="progress"></span><span id="exp-render-label">Render</span></button>
              <a class="cell lg primary" id="exp-download" download hidden><svg class="i"><use href="#i-download"/></svg><span>Download</span></a>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- left: layers -->
    <div class="float lm">
      <section class="island glass layers" id="layers" aria-label="Layers">
        <div class="layers-head">
          <span class="caps">Scene</span>
          <span class="spacer"></span>
          <button class="cell clear icon-btn sm" data-menu="add-menu" data-tip="Add device" data-tip-side="right" aria-label="Add device"><svg class="i"><use href="#i-plus"/></svg></button>
          <div class="menu add-menu" id="add-menu" style="width:220px">
            <button class="menu-item" data-add="phone"><svg class="i"><use href="#i-phone"/></svg><span>Phone<span class="sub">Island cutout</span></span></button>
            <button class="menu-item" data-add="android"><svg class="i"><use href="#i-phone"/></svg><span>Phone<span class="sub">Punch-hole</span></span></button>
            <button class="menu-item" data-add="tablet"><svg class="i"><use href="#i-tablet"/></svg><span>Tablet</span></button>
            <button class="menu-item" data-add="laptop"><svg class="i"><use href="#i-laptop"/></svg><span>Laptop</span></button>
            <div class="menu-sep"></div>
            <button class="menu-item" data-add="text"><svg class="i"><use href="#i-text"/></svg><span>Text</span><span class="kbd">T</span></button>
          </div>
        </div>
        <div class="layers-list" id="layers-list" role="listbox" aria-label="Layers"></div>
        <div class="layers-foot" id="layout-row" hidden>
          <span class="caps">Layout</span>
          <div class="chips" id="layout-chips"></div>
        </div>
      </section>
    </div>

    <!-- right: inspector -->
    <div class="float rm">
      <section class="island glass inspector" id="inspector" aria-label="Inspector">
        <div class="insp-tabs seg" id="insp-tabs"><button data-value="sel" aria-checked="true">Selection</button><button data-value="scene">Scene</button></div>
        <div class="insp-body" id="insp-body"></div>
      </section>
    </div>

    <!-- bottom: timeline -->
    <div class="float bc tl-float">
      <section class="island glass timeline" id="timeline" aria-label="Timeline"></section>
    </div>
  </div>

  <div class="hud mono" id="hud" hidden></div>
  <input type="file" id="file-media" accept="image/*,video/*" hidden>
  <input type="file" id="file-project" accept=".json,application/json" hidden>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
